name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        include:
          - { os: macos-latest, php: "8.4" }
          - { os: windows-latest, php: "8.4" }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zlib
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress
      - name: format and static analysis
        if: runner.os == 'Linux'
        run: composer check-format && composer analyse
      - run: composer test

  lowest:
    name: PHP 8.1, the oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, mbstring, zlib
          coverage: none
          tools: composer:v2
      - run: composer update --no-progress --prefer-lowest
      - run: composer test

  examples:
    name: examples against a fake ingest, PHP ${{ matrix.php }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.1", "8.5"]
        include:
          - { os: macos-latest, php: "8.5" }
          - { os: windows-latest, php: "8.5" }
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zlib
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress
      - run: vendor/bin/phpunit
